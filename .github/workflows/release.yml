name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", tag):
              raise SystemExit("Expected a tag such as v1.0.0 or v1.1.0-rc.1")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={tag[1:]}\n")
          PY
      - name: Build with tag version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon clean build "-Pversion=$RELEASE_VERSION" --console=plain
      - name: Validate and package release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/package_release.py --version "$RELEASE_VERSION"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          notes_flags=(--generate-notes)
          notes_path="docs/releases/v$RELEASE_VERSION.md"
          if [[ -f "$notes_path" ]]; then
            notes_flags=(--notes-file "$notes_path")
          fi
          gh release create "$RELEASE_TAG" \
            "dist/GeyserCooldownAnimation-$RELEASE_VERSION.jar" \
            "dist/GeyserCooldownAnimation-pack-$RELEASE_VERSION.mcpack" \
            "dist/GeyserCooldownAnimation-$RELEASE_VERSION.zip" \
            "dist/SHA256SUMS.txt" \
            --verify-tag "${notes_flags[@]}" \
            --title "GeyserCooldownAnimation $RELEASE_TAG" \
            "${flags[@]}"
