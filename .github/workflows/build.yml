name: Build
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 21 and 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Read project version
        id: version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path("gradle.properties").read_text()
          version = re.search(r"^version=(.+)$", text, re.M).group(1).strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", version):
              raise SystemExit("Invalid project version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Build
        run: ./gradlew --no-daemon clean build --console=plain
      - name: Validate and package
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/package_release.py --version "$PROJECT_VERSION"
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GeyserCooldownAnimation-${{ steps.version.outputs.version }}
          path: |
            dist/GeyserCooldownAnimation-${{ steps.version.outputs.version }}.jar
            dist/GeyserCooldownPaperBridge-${{ steps.version.outputs.version }}.jar
            dist/GeyserCooldownAnimation-pack-${{ steps.version.outputs.version }}.mcpack
            dist/GeyserCooldownAnimation-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
